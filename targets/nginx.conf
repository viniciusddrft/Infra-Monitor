# Alvos locais determinísticos para desenvolvimento e smoke test.
#
# Não substituem os fakes httptest do worker — aqueles cobrem timeout, corpo
# travado e corpo gigante de forma determinística, dentro do processo de teste.
# Estes existem para exercitar o ciclo completo (claim → check → histórico →
# incidente) com dados reais no banco.

server {
    listen 80 default_server;
    access_log /dev/stdout;

    # sobe: o caminho feliz
    location = /ok {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # cai por status fora do esperado → down / unexpected_status
    location = /erro {
        add_header Content-Type text/plain;
        return 500 'erro interno';
    }

    location = /nao-encontrado {
        add_header Content-Type text/plain;
        return 404 'nao encontrado';
    }

    # redirect que termina bem → up, com 1 salto
    location = /redireciona {
        return 302 /ok;
    }

    # redirect de alvo "público" para a metadata da nuvem.
    # O guard do job já passou; quem bloqueia é o Dialer.Control revalidando o
    # salto → unknown / ssrf_blocked. É o cenário da crítica B12.
    location = /redireciona-privado {
        return 302 'http://169.254.169.254/latest/meta-data/';
    }

    # cadeia longa: 6 saltos, acima do máximo de 5 → too_many_redirects
    location = /cadeia      { return 302 /cadeia-2; }
    location = /cadeia-2    { return 302 /cadeia-3; }
    location = /cadeia-3    { return 302 /cadeia-4; }
    location = /cadeia-4    { return 302 /cadeia-5; }
    location = /cadeia-5    { return 302 /cadeia-6; }
    location = /cadeia-6    { return 302 /ok; }

    location / {
        return 404 'rota de teste desconhecida';
    }
}
